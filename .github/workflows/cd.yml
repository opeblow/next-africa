name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-pages:
    name: Deploy frontend to Cloudflare Pages
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -w frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.next.africa' }}

      - name: Deploy to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=next-africa

  frontend-preview:
    name: Preview frontend for pull requests
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -w frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL_STAGING || vars.VITE_API_URL || 'https://api.next.africa' }}

      - name: Deploy preview to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=next-africa --branch=pr-${{ github.event.number }}

  backend-package:
    name: Package backend for Node host
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Upload backend source
        uses: actions/upload-artifact@v4
        with:
          name: backend-src
          path: |
            backend/src
            backend/migrations
            backend/package.json
          if-no-files-found: error

  # The backend runs on a Node host (Render / Fly.io / Railway / VPS) with a
  # managed Postgres. Point that host's deploy hook at this workflow and
  # uncomment the secret-gated step below.
  #
  # - name: Deploy backend (Render)
  #   if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
  #   run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK }}"
