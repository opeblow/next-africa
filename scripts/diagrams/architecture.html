<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; background:#f8f8fc; font-family:'DM Sans', sans-serif; }
  svg text { font-family:'DM Sans', sans-serif; }
  .t { font-size:34px; font-weight:800; fill:#202842; letter-spacing:-1px; }
  .s { font-size:16px; fill:#7b8192; }
  .box { fill:#ffffff; stroke:#deddf0; stroke-width:2.5; }
  .tag { font-size:12px; fill:#8a90a2; }
  .name { font-size:16px; font-weight:700; fill:#262c46; }
  .on .box { fill:#f0edff; stroke:#5c4de2; stroke-width:4; }
  .on .name { fill:#4a3fc4; }
  .off .box { fill:#eef0f7; stroke:#cfcdea; }
  .edge { stroke:#d5d2ea; stroke-width:2.5; stroke-dasharray:1 2; opacity:.9; }
  .edge.on { stroke:#5c4de2; stroke-width:4.5; stroke-dasharray:none; }
  .dot { fill:#5c4de2; }
  .pl { font-size:13px; font-weight:700; fill:#5c4de2; }
  .cap { font-size:11px; fill:#889; }
</style>
</head>
<body>
<svg id="svg" viewBox="0 0 1400 860" width="1400" height="860">
  <text class="t" x="40" y="50">NEXT Africa — page &amp; screen flow</text>
  <text class="s" x="40" y="74">how the app moves from the landing page to a completed commitment</text>

  <g class="edge" id="ld1"><line x1="240" y1="150" x2="390" y2="150"/></g>
  <g class="edge" id="ld2"><line x1="610" y1="150" x2="760" y2="150"/></g>
  <g class="edge" id="authd"><line x1="930" y1="190" x2="930" y2="260"/></g>
  <g class="edge" id="dtoc"><line x1="900" y1="300" x2="600" y2="360"/></g>
  <g class="edge" id="ctoa"><line x1="470" y1="400" x2="680" y2="400"/></g>
  <g class="edge" id="atop"><line x1="900" y1="400" x2="1110" y2="400"/></g>
  <g class="edge" id="exre"><line x1="1110" y1="440" x2="1110" y2="500"/></g>
  <g class="edge" id="nud1"><line x1="560" y1="360" x2="200" y2="580"/></g>
  <g class="edge" id="nud2"><line x1="200" y1="620" x2="200" y2="640"/></g>
  <g class="edge" id="pro1"><line x1="560" y1="360" x2="420" y2="580"/></g>
  <g class="edge" id="pro2"><line x1="420" y1="620" x2="420" y2="640"/></g>
  <g class="edge" id="ins1"><line x1="560" y1="360" x2="640" y2="580"/></g>
  <g class="edge" id="ins2"><line x1="640" y1="620" x2="640" y2="640"/></g>
  <g class="edge" id="set1"><line x1="560" y1="360" x2="860" y2="580"/></g>
  <g class="edge" id="set2"><line x1="860" y1="620" x2="860" y2="640"/></g>

  <!-- node defs: cx, cy, w, h, name, tag -->
  <g class="n" data-cx="120" data-cy="150"><rect class="box" x="50" y="110" width="190" height="80" rx="16"/><text class="name" x="145" y="150" text-anchor="middle">Landing</text><text class="tag" x="145" y="170" text-anchor="middle">hero · phone mockup</text></g>
  <g class="n" data-cx="390" data-cy="150"><rect class="box" x="390" y="110" width="220" height="80" rx="16"/><text class="name" x="500" y="150" text-anchor="middle">Get started ↗</text><text class="tag" x="500" y="170" text-anchor="middle">primary CTA</text></g>
  <g class="n" data-cx="760" data-cy="150"><rect class="box" x="760" y="110" width="170" height="80" rx="16"/><text class="name" x="845" y="150" text-anchor="middle">Auth</text><text class="tag" x="845" y="170" text-anchor="middle">sign up · sign in</text></g>
  <g class="n" data-cx="930" data-cy="300"><rect class="box" x="835" y="260" width="190" height="80" rx="16"/><text class="name" x="930" y="300" text-anchor="middle">Today</text><text class="tag" x="930" y="320" text-anchor="middle">dashboard hub</text></g>
  <g class="n" data-cx="470" data-cy="400"><rect class="box" x="350" y="360" width="240" height="80" rx="16"/><text class="name" x="470" y="400" text-anchor="middle">Chat · capture</text><text class="tag" x="470" y="420" text-anchor="middle">message · voice · file</text></g>
  <g class="n" data-cx="900" data-cy="400"><rect class="box" x="790" y="360" width="220" height="80" rx="16"/><text class="name" x="900" y="400" text-anchor="middle">Task analysis</text><text class="tag" x="900" y="420" text-anchor="middle">LLM extracts</text></g>
  <g class="n" data-cx="1110" data-cy="400"><rect class="box" x="1000" y="360" width="220" height="80" rx="16"/><text class="name" x="1110" y="400" text-anchor="middle">Execution plan</text><text class="tag" x="1110" y="420" text-anchor="middle">approval</text></g>
  <g class="n" data-cx="1110" data-cy="520"><rect class="box" x="1015" y="480" width="190" height="80" rx="16"/><text class="name" x="1110" y="520" text-anchor="middle">Execute</text><text class="tag" x="1110" y="540" text-anchor="middle">live progress</text></g>
  <g class="n" data-cx="200" data-cy="680"><rect class="box" x="115" y="640" width="170" height="80" rx="16"/><text class="name" x="200" y="680" text-anchor="middle">Nudges</text><text class="tag" x="200" y="700" text-anchor="middle">proactive follow-up</text></g>
  <g class="n" data-cx="420" data-cy="680"><rect class="box" x="335" y="640" width="170" height="80" rx="16"/><text class="name" x="420" y="680" text-anchor="middle">Projects</text><text class="tag" x="420" y="700" text-anchor="middle">chains</text></g>
  <g class="n" data-cx="640" data-cy="680"><rect class="box" x="555" y="640" width="170" height="80" rx="16"/><text class="name" x="640" y="680" text-anchor="middle">Insights</text><text class="tag" x="640" y="700" text-anchor="middle">execution memory</text></g>
  <g class="n" data-cx="860" data-cy="680"><rect class="box" x="775" y="640" width="170" height="80" rx="16"/><text class="name" x="860" y="680" text-anchor="middle">Settings</text><text class="tag" x="860" y="700" text-anchor="middle">proactivity level</text></g>

  <circle class="dot" id="dot" r="9" cx="-40" cy="-40" fill="#5c4de2"/>
  <text class="pl" id="step" x="40" y="800"></text>
  <text class="cap" x="40" y="825">animated · recorded live from the running app</text>
</svg>
<script>
  (function () {
    const centers = {};
    document.querySelectorAll('.n').forEach(function (n) {
      const name = n.querySelector('.name').textContent.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
      centers[name] = { x: +n.dataset.cx, y: +n.dataset.cy, el: n };
    });
    const journey = [
      ['ld1','landing','getstarted'],
      ['ld2','getstarted','auth'],
      ['authd','auth','today'],
      ['dtoc','today','chatcapture'],
      ['ctoa','chatcapture','taskanalysis'],
      ['atop','taskanalysis','executionplan'],
      ['exre','executionplan','execute'],
      ['nud1','chatcapture','nudges'],
      ['pro1','chatcapture','projects'],
      ['ins1','chatcapture','insights'],
      ['set1','chatcapture','settings'],
    ];
    let idx = 0;
    const allEdges = document.querySelectorAll('.edge');
    const allNodes = document.querySelectorAll('.n');
    const dot = document.getElementById('dot');
    const label = document.getElementById('step');
    const nice = { landing:'Landing page', getstarted:'Get started → Auth page', auth:'Auth (sign up / sign in)', today:'Today dashboard hub', chatcapture:'Chat · capture a goal', taskanalysis:'Understand & analyse', executionplan:'Plan · approve', execute:'Execute with live progress', nudges:'Proactive nudges', projects:'Project chains', insights:'Execution memory', settings:'Settings / proactivity' };

    function clear() {
      allEdges.forEach(function (e) { e.classList.remove('on'); });
      allNodes.forEach(function (n) { n.classList.remove('on','off'); });
    }

    function tick() {
      clear();
      const [edgeId, fromKey, toKey] = journey[idx % journey.length];
      const from = centers[fromKey], to = centers[toKey];
      const edge = document.getElementById(edgeId);
      if (edge) edge.classList.add('on');
      if (from && from.el) from.el.classList.add('off');
      if (to && to.el) to.el.classList.add('on');
      label.textContent = (idx % journey.length) + 1 + ' · ' + (nice[toKey] || toKey);
      // animate dot
      const t0 = performance.now(), x1 = from.x, y1 = from.y, x2 = to.x, y2 = to.y, dur = 700;
      dot.setAttribute('cx', x1); dot.setAttribute('cy', y1);
      const stepDot = function (t) {
        const p = Math.min(1, (t - t0) / dur);
        dot.setAttribute('cx', x1 + (x2 - x1) * p);
        dot.setAttribute('cy', y1 + (y2 - y1) * p);
        if (p < 1) requestAnimationFrame(stepDot);
      };
      requestAnimationFrame(stepDot);
      idx++;
    }

    setInterval(tick, 1800);
    tick();
  })();
</script>
</body>
</html>
