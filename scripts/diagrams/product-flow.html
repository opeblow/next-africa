<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; background:#f8f8fc; font-family:'DM Sans', sans-serif; }
  svg text { font-family:'DM Sans', sans-serif; }
  .t { font-size:34px; font-weight:800; fill:#202842; letter-spacing:-1px; }
  .s { font-size:16px; fill:#7b8192; }
  .box { fill:#f0edff; stroke:#5c4de2; stroke-width:2.5; }
  .box .name { fill:#4a3fc4; }
  .name { font-size:15px; font-weight:700; fill:#262c46; }
  .tag { font-size:11px; fill:#7a8098; }
  .diamond { fill:#fff; stroke:#e6a35a; stroke-width:2.5; }
  .diamond .name { fill:#b06a1f; }
  .arrow { stroke:#5c4de2; stroke-width:2.5; fill:none; }
  .arrowhead { fill:#5c4de2; }
  .badge { font-size:11px; font-weight:700; fill:#5c4de2; }
  .green .box { fill:#e7f4ee; stroke:#3e9e70; }
  .green .name { fill:#2b8858; }
  .blue .box { fill:#e4f4f8; stroke:#4a94a5; }
  .blue .name { fill:#2d7487; }
  .teal .box { fill:#fdeee3; stroke:#e6a35a; }
  .teal .name { fill:#a3601f; }
</style>
</head>
<body>
<svg viewBox="0 0 1000 1320" width="1000" height="1320">
  <text class="t" x="46" y="52">NEXT Africa — product flow</text>
  <text class="s" x="46" y="76">from a chat message to a finished commitment</text>

  <!-- 1 -->
  <g><rect class="box" x="330" y="120" width="340" height="80" rx="16"/><text class="name" x="500" y="154" text-anchor="middle">You message naturally</text><text class="tag" x="500" y="176" text-anchor="middle">WhatsApp-style · voice note · attached file</text></g>
  <g><line class="arrow" x1="500" y1="200" x2="500" y2="250"/><path class="arrowhead" d="M490 248 L500 262 L510 248 Z"/></g>

  <!-- 2 -->
  <g><rect class="box" x="330" y="262" width="340" height="80" rx="16"/><text class="name" x="500" y="296" text-anchor="middle">Right where you already are</text><text class="tag" x="500" y="318" text-anchor="middle">capture · today · projects · nudges</text></g>
  <g><line class="arrow" x1="500" y1="342" x2="500" y2="392"/><path class="arrowhead" d="M490 390 L500 404 L510 390 Z"/></g>

  <!-- 3 -->
  <g><rect class="box green" x="330" y="404" width="340" height="80" rx="16"/><text class="name" x="500" y="438" text-anchor="middle">OpenAI understands</text><text class="tag" x="500" y="460" text-anchor="middle">LLM extraction → commitments with dates</text></g>
  <g><line class="arrow" x1="500" y1="484" x2="500" y2="534"/><path class="arrowhead" d="M490 532 L500 546 L510 532 Z"/></g>

  <!-- 4 diamond: clear? -->
  <g class="diamond"><polygon points="500,546 610,610 500,674 390,610"/><text class="name" x="500" y="605" text-anchor="middle" font-size="13">Clear enough</text><text class="name" x="500" y="622" text-anchor="middle" font-size="11">to act on?</text></g>

  <!-- yes down -->
  <g><line class="arrow" x1="500" y1="674" x2="500" y2="724"/><path class="arrowhead" d="M490 722 L500 736 L510 722 Z"/><text class="badge" x="512" y="704">yes</text></g>

  <!-- 5 -->
  <g><rect class="box blue" x="330" y="736" width="340" height="80" rx="16"/><text class="name" x="500" y="770" text-anchor="middle">Structured &amp; linked</text><text class="tag" x="500" y="792" text-anchor="middle">task · deadline · meeting · reminder</text></g>
  <g><line class="arrow" x1="500" y1="816" x2="500" y2="866"/><path class="arrowhead" d="M490 864 L500 878 L510 864 Z"/></g>

  <!-- 6 -->
  <g><rect class="box" x="330" y="878" width="340" height="80" rx="16"/><text class="name" x="500" y="912" text-anchor="middle">Day is grouped</text><text class="tag" x="500" y="934" text-anchor="middle">today · waiting for · projects</text></g>
  <g><line class="arrow" x1="500" y1="958" x2="500" y2="1008"/><path class="arrowhead" d="M490 1006 L500 1020 L510 1006 Z"/></g>

  <!-- 7 -->
  <g><rect class="box" x="330" y="1020" width="340" height="80" rx="16"/><text class="name" x="500" y="1054" text-anchor="middle">Executed step by step</text><text class="tag" x="500" y="1076" text-anchor="middle">with live progress</text></g>

  <!-- no branch to clarify -->
  <g><line class="arrow" x1="390" y1="610" x2="160" y2="610" /><path class="arrowhead" d="M162 600 L148 610 L162 620 Z"/><text class="badge" x="240" y="600">no</text></g>
  <g><rect class="box teal" x="20" y="580" width="140" height="60" rx="14"/><text class="name" x="90" y="610" text-anchor="middle" font-size="12">you clarify</text><text class="tag" x="90" y="626" text-anchor="middle" font-size="9">next message</text></g>
  <g><path class="arrow" d="M90 640 C 90 700, 460 660, 500 640" /><path class="arrowhead" d="M490 634 L500 650 L510 634 Z"/></g>

  <!-- branch across: nudges / insights from grouped day -->
  <g><line class="arrow" x1="500" y1="1058" x2="500" y2="1120"/><path class="arrowhead" d="M490 1118 L500 1132 L510 1118 Z"/></g>

  <!-- end -->
  <g class="green"><rect class="box" x="330" y="1132" width="340" height="78" rx="18"/><text class="name" x="500" y="1166" text-anchor="middle">Nothing quietly disappears</text><text class="tag" x="500" y="1186" text-anchor="middle">completed · nudged · followed up</text></g>

  <text class="badge" x="46" y="1098">cloud flow</text>
  <text class="badge" x="46" y="1148">outcome</text>

  <!-- highlight classes for animation -->
  <polygon class="step-hl" points="330,120 670,120 670,200 330,200" style="display:none" fill="#5c4de2" opacity="0"/>
  <polygon class="step-hl" points="330,262 670,262 670,342 330,342" style="display:none" fill="#5c4de2" opacity="0"/>
  <polygon class="step-hl" points="330,404 670,404 670,484 330,484" style="display:none" fill="#3e9e70" opacity="0"/>
  <polygon class="step-hl" points="390,546 610,546 610,674 390,674" style="display:none" fill="#e6a35a" opacity="0"/>
  <polygon class="step-hl" points="330,736 670,736 670,816 330,816" style="display:none" fill="#4a94a5" opacity="0"/>
  <polygon class="step-hl" points="330,878 670,878 670,958 330,958" style="display:none" fill="#5c4de2" opacity="0"/>
  <polygon class="step-hl" points="330,1020 670,1020 670,1100 330,1100" style="display:none" fill="#5c4de2" opacity="0"/>
  <polygon class="step-hl" points="330,1132 670,1132 670,1210 330,1210" style="display:none" fill="#3e9e70" opacity="0"/>
</svg>
<script>
  (function () {
    const staticMode = location.search.indexOf('static') !== -1;
    if (staticMode) {
      // light up every stage so the static chart reads fully
      document.querySelectorAll('.step-hl').forEach(function (s, k) {
        s.style.display = 'block';
        s.setAttribute('fill-opacity', 0.5);
      });
      return;
    }
    const steps = document.querySelectorAll('.step-hl');
    let i = 0;
    function tick() {
      steps.forEach(function (s, k) {
        if (k < i % (steps.length + 1)) { s.style.display = 'block'; s.setAttribute('fill-opacity', 0.5); }
        else { s.style.display = 'none'; s.setAttribute('fill-opacity', 0); }
      });
      const cur = steps[i % steps.length];
      if (cur) { cur.style.display = 'block'; cur.setAttribute('fill-opacity', 1); }
      i++;
      if (i > steps.length) i = 0;
    }
    setInterval(tick, 800);
    tick();
  })();
</script>
</body>
</html>
